name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

# A double-tap on "Run workflow" (easy to do on a phone) would otherwise queue a
# second APK build that produces an identical artefact. Keep only the newest run
# per branch and cancel the superseded one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # @capacitor/cli@8.6.2 declares engines.node ">=22.0.0".
          node-version: '22'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          # android/app/capacitor.build.gradle compiles with JavaVersion.VERSION_21.
          distribution: temurin
          java-version: '21'

      - name: Show tool versions
        run: |
          node --version
          npm --version
          java -version

      # ubuntu-latest already ships an Android SDK. android-actions/setup-android
      # is deliberately not used: it tries to install the removed "tools" package
      # and fails on current cmdline-tools.
      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n1)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artefact
        uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Actions artefacts are always delivered as a .zip and need a GitHub login to
      # download, which makes them awkward to install straight from a phone. Publishing
      # the raw .apk as a release asset gives a direct, public download link that
      # Android can open and install in one tap.
      - name: Rename APK for direct download
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             release/expense-tracker-debug.apk
          ls -l release/

      - name: Publish APK to a rolling release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Latest debug APK
          body: |
            Direct-download debug build of Expense Tracker.

            Built from commit ${{ github.sha }} on ${{ github.ref_name }}.

            Install: download `expense-tracker-debug.apk` below and open it on your
            Android device. You may need to allow "Install unknown apps" for your browser.
          files: release/expense-tracker-debug.apk
          make_latest: true
