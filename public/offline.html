<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="robots" content="noindex" />
    <title>Offline &mdash; Expense Tracker</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f8fafc;
        color: #1e293b;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        width: 100%;
        max-width: 26rem;
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        background: #fff;
        padding: 32px 24px;
        text-align: center;
        box-shadow: 0 1px 2px rgb(15 23 42 / 0.04), 0 8px 24px -12px rgb(15 23 42 / 0.18);
      }

      .mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        margin-bottom: 18px;
        border-radius: 16px;
        background: linear-gradient(160deg, #14b8a6, #0f766e);
        color: #fff;
        font-size: 28px;
        font-weight: 700;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.25rem;
        font-weight: 700;
        color: #0f172a;
      }

      p {
        margin: 0 0 20px;
        font-size: 0.9rem;
        line-height: 1.6;
        color: #475569;
      }

      .hint {
        margin: 0;
        font-size: 0.8rem;
        color: #64748b;
      }

      button {
        appearance: none;
        border: 0;
        border-radius: 12px;
        background: #0f766e;
        color: #fff;
        font: inherit;
        font-weight: 600;
        padding: 12px 22px;
        cursor: pointer;
        transition: background 0.15s ease;
      }

      button:hover {
        background: #115e59;
      }

      button:focus-visible {
        outline: 2px solid #14b8a6;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="mark" aria-hidden="true">&#8358;</span>
      <h1>You are offline</h1>
      <p>
        Expense Tracker could not load the app shell because there is no network connection. Your
        saved transactions are still on this device.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
      <p class="hint" style="margin-top: 18px">
        Reconnect to the internet and reload to get the latest version.
      </p>
    </main>
  </body>
</html>
